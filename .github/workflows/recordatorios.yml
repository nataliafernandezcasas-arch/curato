# Cada diez minutos, la tarea que revisa las visitas y manda los avisos de las stories
# (/api/cron/recordatorios), y la que pone Instagram al día (/api/cron/instagram).
#
# Va en GitHub Actions y no en Vercel Cron porque el plan gratuito de Vercel
# solo permite una tarea al día. Hace falta el mismo secreto en dos sitios:
#   · GitHub: Settings, Secrets and variables, Actions, secreto CRON_SECRET;
#   · Vercel: Settings, Environment Variables, CRON_SECRET (Production).
# Sin él la ruta responde 401 y no manda nada.

name: Recordatorios de stories

on:
  schedule:
    # Cada diez minutos, empezando en el 3 para no caer en los minutos
    # redondos, que es cuando GitHub va más cargado y más se retrasa. Antes era
    # cada hora; el aviso con el código QR sale 15 min antes de la visita, y con
    # una pasada por hora habría llegado tarde.
    - cron: "3-59/10 * * * *"
  workflow_dispatch: {}

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Llamar a la tarea
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # Sin espacios ni saltos de línea: si el secreto se pegó con un
          # salto al final, curl rechaza la cabecera (error 43) y no llama.
          TOKEN="$(printf '%s' "$CRON_SECRET" | tr -d '[:space:]')"
          if [ -z "$TOKEN" ]; then
            echo "Falta el secreto CRON_SECRET en GitHub (Settings, Secrets and variables, Actions)."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 120 \
            -H "Authorization: Bearer ${TOKEN}" \
            https://www.curatocollective.com/api/cron/recordatorios

      # Y, con el mismo secreto, Instagram al día: los seguidores y las últimas
      # publicaciones de los storytellers (/api/cron/instagram). Si falla, no
      # tumba los recordatorios, que ya han salido en el paso anterior.
      - name: Instagram al día
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          TOKEN="$(printf '%s' "$CRON_SECRET" | tr -d '[:space:]')"
          curl --fail-with-body --silent --show-error --max-time 90 \
            -H "Authorization: Bearer ${TOKEN}" \
            https://www.curatocollective.com/api/cron/instagram
